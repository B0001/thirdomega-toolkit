[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdomega"
version = "0.1.0"
description = "Coherent 3-omega thermal measurement toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["thirdomega*"]

# The worker loop lives in the verified-sandbox package (`uv tool install
# --editable`), not in this repo and not in its dependency graph. Only what
# genuinely differs per repo is here; see that package's README for every key.
[tool.sandbox]
# A preregistration is worth exactly nothing if it can be amended after the
# measurement, and its own header says "Do not amend entries." Prose in a
# prompt is advisory, so this is the wall: the pre-commit hook refuses any
# commit that deletes or rewrites an existing line here. Appending is fine.
# It binds humans too, deliberately -- a worker cannot commit, but it can leave
# an amended file in the tree for a human to commit inside a larger diff.
append-only = ["predictions/PREREGISTRATION.md"]
